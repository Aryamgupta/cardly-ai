<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cardly AI - Scanning Experience</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1c30; /* Deep Dark for Immersive Scan */
            color: #ffffff;
            margin: 0;
            overflow: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(21, 27, 46, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* AI Glow Animation */
        @keyframes scanline {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #8455ef, #c0c1ff, #8455ef, transparent);
            box-shadow: 0 0 20px 4px rgba(132, 85, 239, 0.6);
            position: absolute;
            width: 100%;
            z-index: 20;
            animation: scanline 3s ease-in-out infinite;
        }

        /* Shimmer Effect for AI Status */
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .ai-shimmer {
            position: relative;
            overflow: hidden;
        }
        .ai-shimmer::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(132, 85, 239, 0.2), transparent);
            animation: shimmer 2s infinite;
        }

        /* Floating Label Entry */
        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .tag-pop {
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Viewfinder corners */
        .corner {
            width: 32px;
            height: 32px;
            border-color: #8455ef;
            position: absolute;
            z-index: 30;
        }
    </style>

                        "outline": "#767586",
                        "on-primary": "#ffffff",

                        "inverse-primary": "#c0c1ff",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "surface-container": "#e5eeff",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#414658",
                        "tertiary-container": "#72768a",
                        "secondary-fixed-dim": "#d0bcff",
                        "surface-container-highest": "#d3e4fe",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#d3e4fe",
                        "on-tertiary-container": "#020413",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#dee1f9",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-dim": "#cbdbf5",
                        "surface": "#f8f9ff",
                        "on-surface": "#0b1c30",
                        "on-secondary-container": "#fffbff",
                        "on-tertiary-fixed": "#161b2b",
                        "outline-variant": "#c7c4d7",
                        "inverse-on-surface": "#eaf1ff",
                        "primary-container": "#6063ee",
                        "surface-container-low": "#eff4ff",

                        "body-lg": ["Inter"],

            }
        }

<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-on-background h-screen flex flex-col overflow-hidden">

</div>
<div class="tag-pop absolute top-[45%] left-[25%] glass-panel px-3 py-1 rounded-full border-secondary-container flex items-center gap-1" style="animation-delay: 0.5s;">

<button class="flex flex-col items-center gap-1 group">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-white/5 border border-white/10 group-hover:bg-white/10 transition-all">

</button>
</div>

<!-- Bottom Nav Bar (Shared Component Logic - Suppressed because transactional task) -->
<!-- Not rendering BottomNavBar here per instruction: "The screen shows the viewfinder... Task-Focused" -->
<script>
        // AI Status Simulation
        const statuses = [
            "Analyzing card structure...",
            "Detecting language...",
            "Extracting contact info...",
            "Mapping social profiles...",
            "Verifying company data...",
            "Ready for review."
        ];
        
        let statusIdx = 0;
        const statusElement = document.getElementById('status-text');
        const progressBar = document.getElementById('progress-bar');
        const labelContainer = document.getElementById('ai-labels');

        function updateAIStatus() {
            statusIdx = (statusIdx + 1) % statuses.length;
            statusElement.style.opacity = 0;
            
            setTimeout(() => {
                statusElement.innerText = statuses[statusIdx];
                statusElement.style.opacity = 1;
                
                // Update progress bar
                const progress = ((statusIdx + 1) / statuses.length) * 100;
                progressBar.style.width = `${progress}%`;

                // Add random pop tags
                if (statusIdx < 4) {
                    createNewTag();
                }
            }, 300);
        }

        function createNewTag() {
            const types = [
                { icon: 'phone', label: 'Phone Extracted' },
                { icon: 'link', label: 'URL Found' },
                { icon: 'pin_drop', label: 'Address Parsed' },
                { icon: 'share', label: 'LinkedIn Profile' }
            ];
            const type = types[Math.floor(Math.random() * types.length)];
            
            const tag = document.createElement('div');
            tag.className = 'tag-pop absolute glass-panel px-3 py-1 rounded-full border-secondary-container flex items-center gap-1';
            tag.style.top = `${Math.random() * 60 + 20}%`;
            tag.style.left = `${Math.random() * 60 + 10}%`;
            tag.innerHTML = `
                <span class="material-symbols-outlined text-[14px] text-secondary-fixed-dim" style="font-variation-settings: 'FILL' 1;">${type.icon}</span>
                <span class="text-white font-label-sm text-[10px] uppercase">${type.label}</span>
            `;
            
            labelContainer.appendChild(tag);
            
            // Limit tags on screen
            if (labelContainer.children.length > 6) {
                labelContainer.removeChild(labelContainer.firstChild);
            }
        }

        setInterval(updateAIStatus, 3000);

        // Subtle parallax on card hover for high-end feel
        const container = document.querySelector('.group');
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            container.style.transform = `perspective(1000px) rotateX(${y * 10}deg) rotateY(${-x * 10}deg)`;
        });

        container.addEventListener('mouseleave', () => {
            container.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });
    </script>
</body></html>
